modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mixins]]
config="ae2lightoptimizer.mixins.json"

# Optional bridge for Thunderbolt's max-flow channels (AE2 Lightning Tech overloaded controllers).
# The config's plugin leaves every mixin unapplied when that mod is absent.
[[mixins]]
config="ae2lightoptimizer.compat.mixins.json"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
logoFile="ae2lightoptimizer.png"
description='''Programmable factories, wireless ME links, universal storage and recipe planning for Applied Energistics 2. 应用能源：循环科技。'''

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="${neo_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="ae2"
type="required"
versionRange="${ae2_version_range}"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="ae2cs"
type="optional"
versionRange="[1.2.1,)"
ordering="AFTER"
side="BOTH"

# Dependency marker for addons built against AE2LF.
[[mods]]
modId="ae2lightoptimizer"
version="${mod_version}"
displayName="AE2 LoopTech Legacy ID"
description="Compatibility identifier provided by AE2 LoopTech."
