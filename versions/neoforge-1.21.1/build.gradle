plugins {
    id 'java'
    id 'net.neoforged.moddev' version '2.0.143'
}

version = mod_version
group = mod_group_id

base { archivesName = "ae2lf-neoforge-mc${minecraft_version}" }
java.toolchain.languageVersion = JavaLanguageVersion.of(java_version as int)

repositories {
    mavenCentral()
    maven { url = 'https://maven.blamejared.com' }
    maven { url = 'https://repo.sleeping.town' }
}

dependencies {
    compileOnly "org.appliedenergistics:appliedenergistics2:${ae2_version}"
    compileOnly 'mezz.jei:jei-1.21.1-common-api:19.27.0.343'
    compileOnly 'dev.emi:emi-neoforge:1.1.24+1.21.1:api'
    runtimeOnly "org.appliedenergistics:appliedenergistics2:${ae2_version}"
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'com.google.code.gson:gson:2.11.0'
}

neoForge {
    version = neo_version
    runs {
        client { client() }
        server { server(); programArgument '--nogui' }
        data {
            data()
            programArguments.addAll '--mod', mod_id, '--all', '--output', file('src/generated/resources').absolutePath, '--existing', file('src/main/resources').absolutePath
        }
    }
    mods { "${mod_id}" { sourceSet sourceSets.main } }
}

sourceSets {
    main {
        java.srcDir '../../shared/src/main/java'
        resources.srcDir 'src/generated/resources'
    }
    test.java.srcDir '../../shared/src/test/java'
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
    inputs.file(rootProject.file('../../CHANGELOG.md'))
}

tasks.named('processResources', ProcessResources).configure {
    filteringCharset = 'UTF-8'
    def props = [mod_id: mod_id, mod_name: mod_name, mod_version: mod_version,
                 mod_license: mod_license, minecraft_version_range: minecraft_version_range,
                 neo_version_range: neo_version_range, loader_version_range: loader_version_range,
                 ae2_version_range: project.property('ae2_version_range')]
    inputs.properties props
    filesMatching('META-INF/neoforge.mods.toml') { expand props }
}
